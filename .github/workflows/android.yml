name: Android validation
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - run: python3 tools/localize.py
      - run: python3 tools/audit_localization.py
      - uses: actions/upload-artifact@v4
        with:
          name: development-build-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            localization/report.json
