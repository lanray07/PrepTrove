name: Android validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: python3 tools/localize.py
      - run: python3 tools/audit_localization.py
      - run: python3 tools/extract_resources.py --check
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - run: python3 tools/submission_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: development-build-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*unsigned.apk
            app/build/reports/
            localization/report.json
            artifacts/amazon-review.zip
            artifacts/amazon-review.zip.sha256
            artifacts/amazon-review-report.json
